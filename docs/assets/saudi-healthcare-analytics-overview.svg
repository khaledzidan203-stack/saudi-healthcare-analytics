<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Saudi Healthcare Analytics 2021–2024 — project overview</title>
  <desc id="desc">Readable GitHub overview of the Saudi Healthcare Analytics project from official Saudi Ministry of Health yearbooks through governed data preparation, SQL Server, Power BI, and validation.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#083b44"/>
      <stop offset="1" stop-color="#0b6671"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0a3942" flood-opacity="0.12"/>
    </filter>
    <style>
      .font{font-family:Arial,Helvetica,sans-serif}
      .white{fill:#ffffff}.light{fill:#d8eaec}.ink{fill:#123d44}.muted{fill:#54747a}
      .green{fill:#0b7b68}.blue{fill:#256aa8}.gold{fill:#c9932b}.purple{fill:#7554a7}
      .title{font-size:62px;font-weight:700}.subtitle{font-size:28px}.section{font-size:29px;font-weight:700}
      .step{font-size:26px;font-weight:700}.small{font-size:22px}.metric{font-size:38px;font-weight:700}
    </style>
  </defs>

  <rect width="1600" height="560" fill="#f1f7f6"/>

  <!-- Header -->
  <rect width="1600" height="155" fill="url(#hero)"/>
  <text x="70" y="72" class="font white title">Saudi Healthcare Analytics</text>
  <text x="70" y="116" class="font" font-size="34" font-weight="700" fill="#f2c96b">2021–2024</text>
  <text x="350" y="116" class="font light subtitle">Official Saudi MOH statistics → governed analytics → Power BI</text>
  <text x="1530" y="60" text-anchor="end" class="font white" font-size="25" font-weight="700">Capacity · Activity · Workforce · Red Crescent</text>
  <text x="1530" y="98" text-anchor="end" class="font light small">Aggregate public statistics · annual grain</text>
  <text x="1530" y="132" text-anchor="end" class="font light small">National + Administrative Region · no patient-level data</text>

  <!-- Main flow -->
  <text x="70" y="202" class="font ink section">End-to-end analytical pipeline</text>

  <g filter="url(#shadow)" class="font">
    <rect x="65" y="225" width="250" height="125" rx="18" fill="#e9f3fb" stroke="#bdd8eb"/>
    <circle cx="98" cy="258" r="20" fill="#256aa8"/>
    <text x="98" y="266" text-anchor="middle" class="font white" font-size="22" font-weight="700">1</text>
    <text x="130" y="267" class="font ink step">MOH Yearbooks</text>
    <text x="90" y="310" class="font muted small">Official 2021–2024 sources</text>

    <rect x="385" y="225" width="250" height="125" rx="18" fill="#eaf7f2" stroke="#b9ddce"/>
    <circle cx="418" cy="258" r="20" fill="#0b7b68"/>
    <text x="418" y="266" text-anchor="middle" class="font white" font-size="22" font-weight="700">2</text>
    <text x="450" y="267" class="font ink step">Python + Canonical</text>
    <text x="410" y="310" class="font muted small">Discovery · grain · 4 facts + 5 dims</text>

    <rect x="705" y="225" width="250" height="125" rx="18" fill="#fff6e8" stroke="#efd4aa"/>
    <circle cx="738" cy="258" r="20" fill="#c9932b"/>
    <text x="738" y="266" text-anchor="middle" class="font white" font-size="22" font-weight="700">3</text>
    <text x="770" y="267" class="font ink step">SQL Server</text>
    <text x="730" y="310" class="font muted small">Governed analytics schema</text>

    <rect x="1025" y="225" width="250" height="125" rx="18" fill="#f1edfb" stroke="#d8c7ef"/>
    <circle cx="1058" cy="258" r="20" fill="#7554a7"/>
    <text x="1058" y="266" text-anchor="middle" class="font white" font-size="22" font-weight="700">4</text>
    <text x="1090" y="267" class="font ink step">Power BI Model</text>
    <text x="1050" y="310" class="font muted small">TMDL · governed DAX · PBIR</text>

    <rect x="1345" y="225" width="190" height="125" rx="18" fill="#eaf7f2" stroke="#b9ddce"/>
    <circle cx="1378" cy="258" r="20" fill="#0b7b68"/>
    <text x="1378" y="266" text-anchor="middle" class="font white" font-size="22" font-weight="700">5</text>
    <text x="1410" y="267" class="font ink step">Validation</text>
    <text x="1370" y="310" class="font muted small">Reconcile · audit · CI</text>
  </g>

  <!-- arrows -->
  <g class="font" fill="#0b7b68" font-size="42" font-weight="700">
    <text x="335" y="302">→</text>
    <text x="655" y="302">→</text>
    <text x="975" y="302">→</text>
    <text x="1295" y="302">→</text>
  </g>

  <!-- Proof strip -->
  <g filter="url(#shadow)">
    <rect x="65" y="390" width="1470" height="115" rx="20" fill="#ffffff"/>
  </g>
  <text x="90" y="430" class="font ink section">Validated release</text>

  <g class="font" text-anchor="middle">
    <text x="360" y="452" class="metric blue">9</text>
    <text x="360" y="485" class="small ink">canonical tables</text>

    <text x="585" y="452" class="metric purple">10</text>
    <text x="585" y="485" class="small ink">semantic tables</text>

    <text x="805" y="452" class="metric gold">14</text>
    <text x="805" y="485" class="small ink">active relationships</text>

    <text x="1030" y="452" class="metric blue">15</text>
    <text x="1030" y="485" class="small ink">current measures</text>

    <text x="1250" y="452" class="metric green">7</text>
    <text x="1250" y="485" class="small ink">report pages</text>

    <text x="1435" y="452" class="metric gold">121</text>
    <text x="1435" y="485" class="small ink">saved visuals</text>
  </g>

  <text x="80" y="540" class="font muted" font-size="20">Evidence: original governed DAX runtime checks 12/12 PASS · FY006↔FY008 workforce reconciliation 24/24 PASS · canonical↔SQL PASS</text>
</svg>