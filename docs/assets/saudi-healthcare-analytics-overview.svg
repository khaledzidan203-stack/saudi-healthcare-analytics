<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Saudi Healthcare Analytics 2021–2024 — project overview</title>
  <desc id="desc">Evidence-aligned visual summary of the Saudi Healthcare Analytics project from official Saudi Ministry of Health statistical yearbooks through Python discovery, canonical modeling, SQL Server, Power BI, and validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a3942"/><stop offset="1" stop-color="#0e6571"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f8f8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002f36" flood-opacity="0.14"/></filter>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif}.white{fill:#fff}.muted{fill:#d2e5e7}.dark{fill:#113b43}.green{fill:#0d7b68}.gold{fill:#c9952f}.blue{fill:#2467a8}.small{font-size:22px}.body{font-size:24px}.label{font-size:25px;font-weight:700}.metric{font-size:42px;font-weight:700}.h1{font-size:58px;font-weight:700}.h2{font-size:31px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#edf5f4"/>
  <rect width="1600" height="190" fill="url(#bg)"/>
  <text x="70" y="82" class="t white h1">Saudi Healthcare Analytics</text>
  <text x="70" y="130" class="t" font-size="34" font-weight="700" fill="#f2c96b">2021–2024</text>
  <text x="70" y="165" class="t muted" font-size="25">Official Saudi MOH statistics → governed analytics engineering → Power BI</text>
  <text x="1530" y="70" text-anchor="end" class="t white" font-size="26" font-weight="700">Healthcare Capacity · Activity · Workforce · Red Crescent</text>
  <text x="1530" y="112" text-anchor="end" class="t muted small">Aggregate public statistics · annual analytical grain</text>
  <text x="1530" y="148" text-anchor="end" class="t muted small">National + Administrative Region · no patient-level data</text>

  <g filter="url(#shadow)">
    <rect x="55" y="220" rx="20" ry="20" width="1490" height="238" fill="url(#card)"/>
  </g>
  <text x="80" y="262" class="t dark h2">End-to-end analytical path</text>

  <!-- pipeline -->
  <g class="t">
    <g transform="translate(80 295)">
      <rect width="180" height="120" rx="16" fill="#e8f3fb" stroke="#bdd8eb"/>
      <circle cx="26" cy="28" r="17" fill="#2467a8"/><text x="26" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text>
      <text x="18" y="64" class="dark label">MOH Yearbooks</text><text x="18" y="94" class="dark small">2021–2024</text>
    </g>
    <text x="276" y="365" font-size="42" fill="#0d7b68">→</text>
    <g transform="translate(315 295)">
      <rect width="180" height="120" rx="16" fill="#eaf7f2" stroke="#b9ddce"/>
      <circle cx="26" cy="28" r="17" fill="#0d7b68"/><text x="26" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text>
      <text x="18" y="64" class="dark label">Python</text><text x="18" y="94" class="dark small">Discovery &amp; profiling</text>
    </g>
    <text x="511" y="365" font-size="42" fill="#0d7b68">→</text>
    <g transform="translate(550 295)">
      <rect width="180" height="120" rx="16" fill="#f4effc" stroke="#d8c7ef"/>
      <circle cx="26" cy="28" r="17" fill="#7657a8"/><text x="26" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text>
      <text x="18" y="64" class="dark label">Canonical layer</text><text x="18" y="94" class="dark small">4 facts + 5 dimensions</text>
    </g>
    <text x="746" y="365" font-size="42" fill="#0d7b68">→</text>
    <g transform="translate(785 295)">
      <rect width="180" height="120" rx="16" fill="#fff5e8" stroke="#eed2a7"/>
      <circle cx="26" cy="28" r="17" fill="#c9952f"/><text x="26" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text>
      <text x="18" y="64" class="dark label">SQL Server</text><text x="18" y="94" class="dark small">analytics schema</text>
    </g>
    <text x="981" y="365" font-size="42" fill="#0d7b68">→</text>
    <g transform="translate(1020 295)">
      <rect width="200" height="120" rx="16" fill="#eaf2fc" stroke="#c2d6ef"/>
      <circle cx="26" cy="28" r="17" fill="#2467a8"/><text x="26" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">5</text>
      <text x="18" y="64" class="dark label">Power BI model</text><text x="18" y="94" class="dark small">TMDL · governed DAX</text>
    </g>
    <text x="1237" y="365" font-size="42" fill="#0d7b68">→</text>
    <g transform="translate(1275 295)">
      <rect width="230" height="120" rx="16" fill="#eaf7f2" stroke="#b9ddce"/>
      <circle cx="26" cy="28" r="17" fill="#0d7b68"/><text x="26" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">6</text>
      <text x="18" y="64" class="dark label">Report + validation</text><text x="18" y="94" class="dark small">PBIR · reconciliation · audit</text>
    </g>
  </g>

  <!-- metrics -->
  <g filter="url(#shadow)"><rect x="55" y="495" rx="20" width="1490" height="165" fill="#fff"/></g>
  <text x="80" y="535" class="t dark h2">Implemented release</text>
  <g class="t" text-anchor="middle">
    <g transform="translate(130 0)"><text y="590" class="metric blue">4</text><text y="623" class="small dark">reporting years</text></g>
    <g transform="translate(335 0)"><text y="590" class="metric green">9</text><text y="623" class="small dark">canonical tables</text></g>
    <g transform="translate(540 0)"><text y="590" class="metric" fill="#7657a8">10</text><text y="623" class="small dark">semantic tables</text></g>
    <g transform="translate(745 0)"><text y="590" class="metric gold">14</text><text y="623" class="small dark">active relationships</text></g>
    <g transform="translate(950 0)"><text y="590" class="metric blue">15</text><text y="623" class="small dark">current measures</text></g>
    <g transform="translate(1155 0)"><text y="590" class="metric green">7</text><text y="623" class="small dark">report pages</text></g>
    <g transform="translate(1390 0)"><text y="590" class="metric gold">121</text><text y="623" class="small dark">saved visuals</text></g>
  </g>

  <!-- validation and principles -->
  <g filter="url(#shadow)"><rect x="55" y="695" rx="20" width="760" height="150" fill="#fff"/></g>
  <text x="80" y="738" class="t dark h2">Validation evidence</text>
  <text x="85" y="782" class="t body green" font-weight="700">12 / 12</text><text x="195" y="782" class="t body dark">original governed DAX runtime checks PASS</text>
  <text x="85" y="820" class="t body green" font-weight="700">24 / 24</text><text x="195" y="820" class="t body dark">FY006 ↔ FY008 workforce reconciliation PASS</text>

  <g filter="url(#shadow)"><rect x="845" y="695" rx="20" width="700" height="150" fill="#fff"/></g>
  <text x="870" y="738" class="t dark h2">Governance rules</text>
  <text x="875" y="782" class="t body dark">• Separate fact grains · no join multiplication</text>
  <text x="875" y="818" class="t body dark">• Published rates stay non-additive · lineage retained</text>

  <text x="80" y="882" class="t" font-size="19" fill="#55757a">Presentation summary only. Authoritative claims are defined by the repository contracts, canonical data, SQL/Power BI source, screenshots, and validation evidence.</text>
</svg>