<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Saudi Healthcare Analytics 2021–2024 — project overview</title>
  <desc id="desc">Evidence-aligned overview of the Saudi Healthcare Analytics project from official Saudi Ministry of Health yearbooks through Python discovery, canonical modeling, SQL Server, Power BI, and validation.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#083b44"/>
      <stop offset="1" stop-color="#0b6671"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0a3942" flood-opacity="0.12"/>
    </filter>
    <style>
      .f{font-family:Arial,Helvetica,sans-serif}
      .white{fill:#fff}.light{fill:#d8eaec}.ink{fill:#123d44}.muted{fill:#54747a}
      .green{fill:#0b7b68}.blue{fill:#256aa8}.gold{fill:#c9932b}.purple{fill:#7554a7}
      .h1{font-size:54px;font-weight:700}.year{font-size:32px;font-weight:700}.sub{font-size:23px}
      .section{font-size:28px;font-weight:700}.step{font-size:25px;font-weight:700}.body{font-size:20px}
      .metric{font-size:38px;font-weight:700}.mlabel{font-size:19px}
    </style>
  </defs>

  <rect width="1600" height="620" fill="#f1f7f6"/>

  <!-- Header -->
  <rect width="1600" height="160" fill="url(#hero)"/>
  <text x="70" y="64" class="f white h1">Saudi Healthcare Analytics</text>
  <text x="70" y="108" class="f" fill="#f2c96b" font-size="32" font-weight="700">2021–2024</text>
  <text x="70" y="141" class="f light sub">Official Saudi MOH statistics → governed analytics engineering → Power BI</text>

  <g class="f" text-anchor="end">
    <text x="1530" y="48" class="white" font-size="23" font-weight="700">Capacity · Activity · Workforce · Red Crescent</text>
    <text x="1530" y="82" class="light" font-size="20">Aggregate public statistics · annual analytical grain</text>
    <text x="1530" y="113" class="light" font-size="20">National + Administrative Region</text>
    <text x="1530" y="141" class="light" font-size="20">No patient-level data</text>
  </g>

  <!-- Pipeline heading -->
  <text x="70" y="205" class="f ink section">End-to-end analytical pipeline</text>

  <!-- Pipeline cards -->
  <g filter="url(#shadow)" class="f">
    <rect x="65" y="230" width="260" height="145" rx="18" fill="#e9f3fb" stroke="#bdd8eb"/>
    <circle cx="100" cy="265" r="20" fill="#256aa8"/>
    <text x="100" y="273" text-anchor="middle" class="white" font-size="22" font-weight="700">1</text>
    <text x="135" y="273" class="ink step">MOH Yearbooks</text>
    <text x="90" y="314" class="muted body">Official 2021–2024 sources</text>
    <text x="90" y="344" class="muted body">Approved public yearbooks</text>

    <rect x="370" y="230" width="260" height="145" rx="18" fill="#eaf7f2" stroke="#b9ddce"/>
    <circle cx="405" cy="265" r="20" fill="#0b7b68"/>
    <text x="405" y="273" text-anchor="middle" class="white" font-size="22" font-weight="700">2</text>
    <text x="440" y="273" class="ink step">Python + Canonical</text>
    <text x="395" y="314" class="muted body">Discovery · profiling · grain</text>
    <text x="395" y="344" class="muted body">4 facts + 5 dimensions</text>

    <rect x="675" y="230" width="260" height="145" rx="18" fill="#fff6e8" stroke="#efd4aa"/>
    <circle cx="710" cy="265" r="20" fill="#c9932b"/>
    <text x="710" y="273" text-anchor="middle" class="white" font-size="22" font-weight="700">3</text>
    <text x="745" y="273" class="ink step">SQL Server</text>
    <text x="700" y="314" class="muted body">Governed analytics schema</text>
    <text x="700" y="344" class="muted body">Constraints + reconciliation</text>

    <rect x="980" y="230" width="260" height="145" rx="18" fill="#f1edfb" stroke="#d8c7ef"/>
    <circle cx="1015" cy="265" r="20" fill="#7554a7"/>
    <text x="1015" y="273" text-anchor="middle" class="white" font-size="22" font-weight="700">4</text>
    <text x="1050" y="273" class="ink step">Power BI Model</text>
    <text x="1005" y="314" class="muted body">TMDL · governed DAX</text>
    <text x="1005" y="344" class="muted body">PBIR · 14 relationships</text>

    <rect x="1285" y="230" width="250" height="145" rx="18" fill="#eaf7f2" stroke="#b9ddce"/>
    <circle cx="1320" cy="265" r="20" fill="#0b7b68"/>
    <text x="1320" y="273" text-anchor="middle" class="white" font-size="22" font-weight="700">5</text>
    <text x="1355" y="273" class="ink step">Validation</text>
    <text x="1310" y="314" class="muted body">Reconciliation · release audit</text>
    <text x="1310" y="344" class="muted body">GitHub Actions quality gate</text>
  </g>

  <!-- Arrows -->
  <g class="f green" font-size="36" font-weight="700" text-anchor="middle">
    <text x="348" y="308">→</text>
    <text x="653" y="308">→</text>
    <text x="958" y="308">→</text>
    <text x="1263" y="308">→</text>
  </g>

  <!-- Metrics -->
  <g filter="url(#shadow)"><rect x="65" y="410" width="1470" height="120" rx="20" fill="#fff"/></g>
  <text x="90" y="450" class="f ink section">Validated release</text>

  <g class="f" text-anchor="middle">
    <text x="390" y="463" class="metric blue">9</text><text x="390" y="500" class="mlabel ink">canonical tables</text>
    <text x="610" y="463" class="metric purple">10</text><text x="610" y="500" class="mlabel ink">semantic tables</text>
    <text x="825" y="463" class="metric gold">14</text><text x="825" y="500" class="mlabel ink">active relationships</text>
    <text x="1045" y="463" class="metric blue">15</text><text x="1045" y="500" class="mlabel ink">current measures</text>
    <text x="1260" y="463" class="metric green">7</text><text x="1260" y="500" class="mlabel ink">report pages</text>
    <text x="1440" y="463" class="metric gold">121</text><text x="1440" y="500" class="mlabel ink">saved visuals</text>
  </g>

  <!-- Evidence footer -->
  <rect x="65" y="552" width="1470" height="43" rx="12" fill="#e6f3f0"/>
  <text x="800" y="580" text-anchor="middle" class="f ink" font-size="19" font-weight="700">12/12 original governed DAX runtime checks PASS · 24/24 workforce cross-source checks PASS · canonical ↔ SQL Server PASS</text>
</svg>